// PS5 DualSense profile v5. Install as valve/userconfig.d/10-dualsense.cfg.
// Loaded after config.cfg. Intentionally does not reset keyboard/mouse bindings.
joystick "1"
joy_enable "1"
joy_axis_binding "sfpyrl"
hud_fastswitch "1"
// Right-stick only; avoid applying a second engine deadzone.
set ps5_aim_enable "1"
set ps5_aim_deadzone "0.10"
set ps5_aim_exponent "1.6"
joy_pitch_deadzone "0"
joy_yaw_deadzone "0"
joy_pitch "105"
joy_yaw "140"
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+use"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "impulse 100"
bind "BACK" "pause"
bind "START" "cancelselect"
bind "STICK1" "+speed"
bind "STICK2" "+duck"
bind "L1_BUTTON" "+duck"
bind "R1_BUTTON" "+attack2"
bind "L2_BUTTON" "+speed"
bind "R2_BUTTON" "+attack"
bind "DPAD_UP" "impulse 201"
bind "DPAD_DOWN" "lastinv"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"
echo "PS5_DUALSENSE_PROFILE version=5 loaded=1"
