name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Initialize pinned host lighting header dependency
        run: git -C third_party/xash3d-fwgs submodule update --init 3rdparty/library_suffix
      - name: Validate shell sources
        run: bash -n tools/build_native.sh tools/package_release.sh
      - name: Build and run host contracts
        run: make test
      - name: Audit publication boundary
        run: make audit
      - name: Require a clean generated tree
        run: |
          # make test preserves native artifacts for local operator iterations.
          # In this fresh CI checkout only host-test executables may exist.
          rm -rf build/host
          rmdir build
          test ! -e build
          test ! -e dist
          test ! -e release
          git diff --check
